name: Update Google Scholar Metrics

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["SERPAPI_KEY"]
          author_id = "19qDl5gAAAAJ"

          params = {
              "engine": "google_scholar_author",
              "author_id": author_id,
              "hl": "en",
              "api_key": api_key
          }

          url = "https://serpapi.com/search?" + urllib.parse.urlencode(params)

          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)

          cited_by = data.get("cited_by", {})
          table = cited_by.get("table", [])

          citations = None
          h_index = None
          i10_index = None

          for item in table:
              if "citations" in item:
                  citations = item["citations"].get("all")

              if "h_index" in item:
                  h_index = item["h_index"].get("all")

              if "i10_index" in item:
                  i10_index = item["i10_index"].get("all")

              # SerpApi may localize the metric keys.
              if "indice_h" in item:
                  h_index = item["indice_h"].get("all")

              if "indice_i10" in item:
                  i10_index = item["indice_i10"].get("all")

          if citations is None or h_index is None or i10_index is None:
              raise RuntimeError(
                  "Could not find Google Scholar citation metrics in API response."
              )

          metrics = {
              "source": "Google Scholar",
              "author_id": author_id,
              "citations": citations,
              "h_index": h_index,
              "i10_index": i10_index,
              "updated": datetime.now(timezone.utc).isoformat()
          }

          with open("metrics.json", "w", encoding="utf-8") as f:
              json.dump(metrics, f, indent=2)

          print(json.dumps(metrics, indent=2))
          PY

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics.json

          if git diff --cached --quiet; then
            echo "No metric changes."
          else
            git commit -m "Update Google Scholar metrics"
            git push
          fi
